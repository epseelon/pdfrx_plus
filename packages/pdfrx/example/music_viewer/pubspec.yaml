name: music_viewer
description: "Demonstrates how to use the pdfrx plugin."
publish_to: 'none'

environment:
  sdk: ^3.9.2
resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  pdfrx:
    path: ../../

  cupertino_icons: ^1.0.8
  rxdart: ^0.28.0
  url_launcher: ^6.3.2
  synchronized: ^3.4.0
  file_selector: ^1.0.4
  http: ^1.5.0
  path_provider: ^2.1.5
  smooth_page_indicator: ^2.0.1
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints:

flutter:
  uses-material-design: true

  assets:
    - assets/
